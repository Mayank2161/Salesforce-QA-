<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Salesforce QA Agent settings</title>
  <style>
    body { font: 14px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #181818; background: #f3f3f3; margin: 0; }
    main { max-width: 520px; margin: 40px auto; background: #fff; border: 1px solid #d8dde6; border-radius: 10px; padding: 24px 28px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.sub { color: #706e6b; margin: 0 0 20px; }
    label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 4px; }
    input { width: 100%; box-sizing: border-box; font: inherit; padding: 8px 10px; border: 1px solid #c9c9c9; border-radius: 4px; }
    .hint { font-size: 12px; color: #706e6b; margin-top: 4px; }
    code { background: #f3f3f3; padding: 1px 4px; border-radius: 3px; }
    button { margin-top: 20px; font: inherit; font-weight: 600; background: #0176d3; color: #fff; border: none; border-radius: 4px; padding: 9px 18px; cursor: pointer; }
    button:hover { background: #014486; }
    #status { margin-top: 14px; white-space: pre-wrap; }
    #status.ok { color: #2e844a; }
    #status.err { color: #ba0517; }
  </style>
</head>
<body>
  <main>
    <h1 style="display:flex;align-items:center;gap:10px"><img src="icons/icon-48.png" width="36" height="36" alt="">Salesforce QA Agent</h1>
    <p class="sub">Connect this extension to the agent server running on your machine.</p>

    <label for="serverUrl">Agent server URL</label>
    <input id="serverUrl" type="url" placeholder="http://127.0.0.1:4317">
    <div class="hint">Start the server with <code>npm run dev</code> in the project folder.</div>

    <label for="token">Agent token</label>
    <input id="token" type="password" autocomplete="off" placeholder="AGENT_TOKEN from .env">
    <div class="hint">Copy the value of <code>AGENT_TOKEN</code> from the project's <code>.env</code> file.</div>

    <button id="save">Save and test connection</button>
    <div id="status"></div>
  </main>
  <script src="options.js"></script>
</body>
</html>
